[project]
name = "places-ingest"
version = "0.1.0"
description = "Job local de entrelugares.mx: seed, OCR + modelo local, scraping. Corre en la Mac, nunca en la nube."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "dateparser>=1.2",
  "pillow>=10",
  "pyyaml>=6",
  "playwright>=1.47",
  "beautifulsoup4>=4.12",
  "lxml>=5",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
tesseract = ["pytesseract>=0.3"]

[project.scripts]
places-ingest = "places_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["places_ingest"]

[tool.ruff]
line-length = 110
target-version = "py312"
